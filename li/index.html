<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f4ef">
<title>Li</title>
<link rel="icon" id="fav" href="data:,">
<link href="/li/vendor/fonts.css" rel="stylesheet">
<style>
/*
VOICE  calm, private, a little playful; a phone app first
IDEA   Claude-style mobile chat that lives on your own GPU box
PICTURE the rust 3D Zeid Z: idle on home, spins with live tok/s
COLOUR warm paper #f6f4ef, ink #262522, rust accent, amber only for off-box
TYPE   Source Serif 4 for Li's words, system sans for UI, JetBrains Mono for code
*/
:root{
  --bg:#f6f4ef; --card:#fbfaf7; --soft:#eeebe4; --soft2:#e7e3da; --line:#e4e0d7; --ink:#262522; --ink2:#5d5a54; --dim:#9a968e;
  --pink:#D76233; --rust:#9c3a16; --black:#1d1c1a; --home:#3f6b4f; --amber:#b7791f; --amberbg:#fbefd9;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:flex;height:100dvh}
.app{flex:1;display:flex;flex-direction:column;position:relative;max-width:760px;margin:0 auto;width:100%}

/* top bar */
.top{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(10px + var(--safe-t)) 14px 22px;background:linear-gradient(var(--bg) 78%,rgba(246,244,239,0))}
.top .r{display:flex;gap:8px}
.ib.spk.on{background:var(--rust);border-color:var(--rust);color:#fff}
.ib.spk.talking{animation:spkp 1.1s ease-in-out infinite}
@keyframes spkp{50%{box-shadow:0 0 0 6px rgba(156,58,22,.18)}}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04);color:var(--ink)}
.mid{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + var(--safe-t));display:flex;flex-direction:column;align-items:center;gap:4px;max-width:54%}
.title{border:0;background:none;font-size:15px;font-weight:500;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;border-radius:8px;opacity:0}
.convo .title{opacity:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:500;border:0;background:#e5eee7;color:var(--home)}
.pill svg.i{width:13px;height:13px}
.pill.off{background:var(--amberbg);color:var(--amber)}
.pill .case{display:none}
.casemode .pill .case{display:inline;margin-left:4px;padding-left:6px;border-left:1px solid currentColor;opacity:.8}
.more{display:none}.convo .more{display:grid}

/* scroll */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:96px 18px 24px;scrollbar-width:none}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:30px}
.greet{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.01em;margin:18px 0 0}
.sub{font-size:14px;color:var(--dim);margin-top:8px}
.hash{width:16px;text-align:center;color:var(--dim);font-weight:600;flex:none}
.projtag{cursor:pointer;margin-top:14px;font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:6px 10px;display:none}
.inproj .hash{width:16px;text-align:center;color:var(--dim);font-weight:600;flex:none}
.projtag{cursor:pointer;display:inline-block}
.convo .home{display:none}
.thread{display:none}.convo .thread{display:block}

/* messages */
.u{display:flex;flex-direction:column;align-items:flex-end;margin:18px 0}
.u .b{max-width:84%;background:var(--soft);border-radius:20px;padding:10px 15px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.u .uacts{display:flex;gap:2px;margin-top:2px;opacity:.85}
.u .edit{width:100%;max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.u .edit textarea{width:100%;border:0;background:none;resize:none;outline:none;font-size:16px;line-height:1.45;min-height:60px}
.u .edit .row{justify-content:flex-end}
.btn{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:14px;font-weight:500}
.btn.dark{background:var(--black);border-color:var(--black);color:#fff}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#fff}
.files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:84%}
.fc{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;max-width:220px}
.fc img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.fc .ft{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;background:var(--ink2);flex:none}
.fc .ft.pdf{background:#b3271a}.fc .ft.sheet{background:#2f7a4a}.fc .ft.img{background:#5b6e8c}
.fc b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc small{color:var(--dim)}
.fc .x{border:0;background:none;color:var(--dim);padding:0 2px;font-size:16px}

.a{margin:18px 0 22px;font-family:var(--serif);font-size:17.5px;line-height:1.6}
.a p{margin:0 0 12px}.a ul{margin:0 0 12px;padding-left:22px}.a li{margin:0 0 8px}.a b{font-weight:600}
.mem{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:var(--soft);border:0;border-radius:12px;padding:4px 10px;margin-bottom:8px}
.mem svg.i{width:13px;height:13px}
.memlist{font-family:var(--sans);font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:-2px 0 10px}
.memlist div{padding:3px 0}
.code{font-family:var(--sans);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:4px 0 14px;background:var(--card)}
.code .h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line)}
.code .h span{margin-right:auto;font-family:var(--mono)}
.code .h button{height:30px;border:0;border-radius:8px;background:none;padding:0 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.code .h button:active{background:var(--soft)}
.code pre{margin:0;padding:12px;font:12.5px/1.55 var(--mono);overflow-x:auto;color:#3d3a35;max-height:220px}
.acts{display:flex;align-items:center;gap:2px;margin-top:4px;font-family:var(--sans);color:var(--dim)}
.acts button{min-width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.acts button:active{background:var(--soft)}
.acts button.on{color:var(--rust)}
.ver{display:inline-flex;align-items:center;font-size:12.5px;gap:0}
.ver button{min-width:26px}
.where{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.where .off{color:var(--amber);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-family:var(--sans)}
.tag{font-size:11.5px;color:var(--rust);background:#f6e7df;border-radius:8px;padding:2px 7px;white-space:nowrap}
.tag.ex{color:var(--ink2);background:var(--soft);font-family:var(--mono)}
.u .tags{justify-content:flex-end;max-width:84%}
.think{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--ink2);font-size:15px}
.think .lbl{background:linear-gradient(90deg,var(--dim),var(--ink),var(--dim));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
.tps{font:12px var(--mono);color:var(--dim)}
.caret::after{content:"";display:inline-block;width:8px;height:16px;margin-left:2px;vertical-align:-2px;background:var(--pink);border-radius:2px;animation:blink 1s steps(1) infinite}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:none;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.jump.on{display:grid}

/* composer */
.dock{padding:6px 12px calc(12px + var(--safe-b));background:linear-gradient(rgba(246,244,239,0),var(--bg) 30%)}
.comp{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px 12px 10px;box-shadow:0 4px 18px rgba(40,30,20,.07)}
.comp .files{justify-content:flex-start;max-width:100%;margin:0 0 6px}
.comp textarea{display:block;width:100%;border:0;background:none;resize:none;outline:none;font-size:16px;line-height:1.4;padding:6px 6px 10px;max-height:160px}
.comp textarea::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.chip{height:38px;border:0;border-radius:19px;background:var(--soft);padding:0 12px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{font-style:normal;color:var(--dim)}
.chip.webc svg.i{width:16px;height:16px}
.chip.webc.on{background:#e4efe7;color:var(--home)}
.wsrc{font-family:var(--sans);margin:10px 0 2px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:6px}
.wsrc .wl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);padding:4px 6px 6px}
.wsrc .wl svg.i{width:14px;height:14px}
.wsrc a{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13.5px}
.wsrc a:active,.wsrc a:hover{background:var(--soft)}
.wsrc .n{flex:none;width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11.5px;color:var(--ink2)}
.wsrc .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsrc .d{flex:none;color:var(--dim);font-size:12px;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.off i{color:var(--amber);font-weight:500}
.send{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--black);color:#fff;display:grid;place-items:center;flex:none}
.send svg.i{stroke-width:2.2}
.send .stop{display:none;width:12px;height:12px;background:#fff;border-radius:2px}
.busy .send .stop{display:block}.busy .send svg{display:none}
.mic{margin-left:auto}
.hasText .mic,.busy .mic{display:none}
.send.hide{display:none}
.fine{text-align:center;font-size:11.5px;color:var(--dim);margin-top:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.dopen .scrim.d,.sopen .scrim.s{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:#f1eee8;z-index:21;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 10px calc(12px + var(--safe-b));box-shadow:8px 0 30px rgba(0,0,0,.08)}
.dopen .drawer{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-family:var(--serif);font-size:24px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--dim);margin-bottom:6px}
.search input{border:0;background:none;outline:none;height:42px;width:100%;font-size:16px;color:var(--ink)}
.nav button,.list button.it{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 10px;border-radius:12px;font-size:15.5px;text-align:left}
.nav .new{color:#a3401a;font-weight:500}
.nav button:active,.list .it:active{background:var(--soft)}
.lab{font-size:12.5px;color:var(--dim);padding:12px 10px 4px;display:flex;align-items:center;justify-content:space-between}
.lab button{border:0;background:none;color:var(--ink2);font-size:12.5px}
.dscroll{flex:1;overflow-y:auto;scrollbar-width:none}
.list .r{display:flex;align-items:center;border-radius:12px}
.list .r.cur{background:var(--soft)}
.list .it{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .t{overflow:hidden;text-overflow:ellipsis}
.list .it svg.i{width:15px;height:15px;color:var(--dim)}
.list .dots{width:36px;height:36px;border:0;background:none;color:var(--dim);border-radius:10px;flex:none;display:grid;place-items:center}
.empty{padding:6px 10px;color:var(--dim);font-size:14px}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--black);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.me b{font-weight:500;font-size:15px}.me small{display:block;color:var(--dim);font-size:12.5px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:31;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.7,.2,1);max-height:86dvh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.1)}
.scrim.s{z-index:30}
.sopen .sheet{transform:none}
/* sign-in: the regular bottom sheet over a soft blur, can't be swiped away until you're in */
.locked .scrim.s{background:rgba(246,244,239,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.locked .sheet .grab{visibility:hidden}
.authhead{display:flex;flex-direction:column;align-items:center;text-align:center;margin:2px 0 14px}
.authhead .zm{width:54px;height:54px;margin-bottom:8px}
.authhead h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.blurb{font-size:13.5px;line-height:1.5;color:var(--ink2);margin:8px 4px 0;max-width:420px}
.blurb b{font-weight:600;color:var(--ink)}
.fid{width:100%;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500}
.fid svg.i{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;margin:12px 2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.alink{display:block;width:100%;border:0;background:none;color:var(--rust);font-size:14px;padding:12px 0 2px;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;height:34px;border:0;border-radius:9px;background:none;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:var(--ink2)}
.prow .who{flex:1;min-width:0}
.prow .who b{font-weight:500;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who small{color:var(--dim);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pa{display:flex;gap:6px;flex:none}
.badge{font-size:11.5px;border-radius:8px;padding:2px 7px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.badge.admin{background:#f6e7df;color:var(--rust)}.badge.pending,.badge.waiting{background:var(--amberbg);color:#6b4510}.badge.used{background:#e4efe7;color:var(--home)}
.btn.mini{height:30px;border-radius:15px;font-size:13px;padding:0 11px}
.linkbox{font:13px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;word-break:break-all;margin:4px 0 10px;user-select:all;-webkit-user-select:all}
.bigcode{font:600 22px var(--mono);letter-spacing:.08em;text-align:center;margin:4px 0 10px}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 4px 12px}
.vrow button{height:34px;border-radius:17px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13.5px}
.vrow button.on{border-color:var(--rust);color:var(--rust)}
#authf .field{margin-bottom:10px}
#authf .btn.dark,.fid{width:100%;height:48px;border-radius:24px;font-size:15px}
#authf .btns{margin-top:6px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--soft2);margin:0 auto 10px}
.sh{font-size:17px;font-weight:600;margin:4px 4px 10px}
.sbody{overflow-y:auto;scrollbar-width:none}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:13px 6px;border-radius:12px;font-size:16px;text-align:left}
.opt:active{background:var(--soft)}
.opt small{display:block;color:var(--dim);font-size:13px;margin-top:1px}
.opt .ck{margin-left:auto;color:var(--rust)}
.opt.danger{color:#b3271a}
.sw{margin-left:auto;width:44px;height:26px;border-radius:13px;background:var(--soft2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--rust)}.sw.on::after{transform:translateX(18px)}
.field{display:block;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;margin:4px 0 12px}
textarea.field{resize:vertical;min-height:96px;line-height:1.45}
.note{font-size:13px;color:var(--dim);margin:0 4px 12px;line-height:1.45}
.warnbox{background:var(--amberbg);color:#6b4510;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.memitem{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.memitem svg.i{color:var(--dim);width:15px;height:15px;margin-top:3px}
.memitem small{display:block;color:var(--dim);font-size:12.5px}
.sheet .ex{display:block;width:100%;text-align:left;border:0;background:none;border-bottom:1px solid var(--line);padding:10px 4px;font-size:14px}
.sheet .ex b{font-family:var(--mono);font-weight:400;color:var(--rust);margin-right:6px}
.sheet .ex .q{color:var(--ink2);display:block;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* side panel: preview + case packet */
.panel{position:fixed;z-index:25;background:var(--card);display:flex;flex-direction:column;inset:0;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.popen .panel{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--line)}
.ph b{font-weight:600;font-size:15px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;height:30px;padding:0 12px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pb{flex:1;position:relative;overflow:auto;background:#fff}
.pb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pb pre{margin:0;padding:14px;font:13px/1.6 var(--mono);white-space:pre-wrap;color:#3d3a35}
.dcolb{display:none}
/* wide screens: Claude-style layout. Chats sidebar docked on the left (collapsible), chat in the middle,
   preview panel docks on the right and pushes the chat over instead of covering it */
@media (min-width:900px){
  :root{--sbw:288px}
  .shell{padding-left:var(--sbw);transition:padding .28s cubic-bezier(.3,.7,.2,1)}
  .drawer{width:var(--sbw);transform:none;box-shadow:none;border-right:1px solid var(--line);z-index:6}
  .scrim.d{display:none}
  .dcolb{display:grid;margin-left:auto;border:0;background:none;box-shadow:none;width:36px;height:36px}
  body:not(.dcol) #menu{visibility:hidden}
  .dcol .drawer{transform:translateX(-102%)}
  .dcol .shell{padding-left:0}
  .top{padding-left:18px;padding-right:18px}
}
@media (min-width:980px){
  :root{--pw:min(46vw,700px)}
  .panel{inset:0 0 0 auto;width:var(--pw);transform:translateX(102%);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.05)}
  .popen .shell{padding-right:var(--pw)}
}

/* talk mode */
.talk{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 80% at 50% 40%,#2a1a12,#120c09 70%);color:#f4ece6;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + var(--safe-t)) 20px calc(26px + var(--safe-b))}
.talking .talk{display:flex}
.talk .tl{font-size:13px;color:#c9b8ad;display:flex;align-items:center;gap:6px}
.talk .zm.talkz{width:190px;height:190px}
.talk .state{font-family:var(--serif);font-size:26px;margin-top:22px;text-align:center}
.talk .cap{min-height:52px;max-width:340px;text-align:center;color:#d9c9bf;font-size:16px;line-height:1.45;margin-top:10px}
.wave{display:flex;gap:4px;height:28px;align-items:center;margin-top:16px}
.wave i{width:4px;border-radius:2px;background:#e0874a;height:6px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
.talk .tb{display:flex;gap:14px}
.talk .tb button{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.talk .tb .end{background:#c8402a}
.talk .tb svg.i{width:22px;height:22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);background:var(--black);color:#fff;font-size:14px;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Zeid mark */
.zm{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;position:relative}
.zm>*{width:100%;height:100%;display:block}
.zm svg{overflow:visible;filter:drop-shadow(0 1px 1px rgba(60,20,5,.35))}
.zm.big{width:132px;height:132px}
.zm.mini{width:22px;height:22px}
.dh .zm{width:30px;height:30px}
.think .zm.mini{width:26px;height:26px}
.zm.spin svg{animation:yspin 1.4s linear infinite,rustcycle 2.8s linear infinite}
.zm.idle svg{animation:sway 6s ease-in-out infinite}
@keyframes yspin{to{transform:rotateY(360deg)}}
@keyframes sway{50%{transform:rotateY(22deg)}}
@keyframes rustcycle{50%{filter:hue-rotate(14deg) brightness(1.15)}}
@keyframes blink{50%{opacity:0}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes wv{50%{height:26px}}
.u,.a{animation:rise .25s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- markdown (escaped first, then a small safe subset) ---------- */
function inl(t){
  let x = esc(t);
  x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
  x = x.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');

function parseMd(md){

  const flush = () => { if(para.length){ out.push({p: inl(para.join(' '))}); para = []; } };
  while(i < lines.length){
    const l = lines[i];
    const f = l.match(/^\s*```\s*([\w.+-]*)\s*$/);
    if(f){
      flush(); const lang = (f[1] || '').toLowerCase(), buf = []; i++;

      const html = lang === 'html' || /^\s*<!doctype html|^\s*<html/i.test(src);
      out.push({code:{lang: html ? 'html' : lang, title: html ? 'page.html' : (lang || 'code'), src}}); continue;
    }
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ flush(); out.push({h: inl(h[2])}); i++; continue; }

      flush(); const ordered = /^\s*\d/.test(l), items = [];

}

const TEXTY = /\.(txt|md|markdown|csv|tsv|json|ya?ml|xml|html?|css|js|ts|py|ps1|sh|sql|log|ini|conf|toml)$/i;
function addFiles(list){
  [...list].forEach(f => {
    const k = kind(f.name), e = {n:f.name, s:f.size, k, url: k === 'img' ? URL.createObjectURL(f) : ''};
    pending.push(e);
    if(k === 'img'){ if(f.size > 8e6){ e.skip = 'too big'; return; } const r = new FileReader(); r.onload = () => e.data = r.result; r.readAsDataURL(f); }
    else if(TEXTY.test(f.name)){ if(f.size > 2e5){ e.skip = 'too big'; return; } f.text().then(t => e.text = t); }
    else { e.busy = true; boxExtract(f).then(t => { e.text = t; }, () => { e.skip = 'unread'; toast(`Couldn't read ${f.name}`); }).finally(() => { e.busy = false; renderAtt(); }); }
  });

}
/* the box's own document reader (Open WebUI file extraction), nothing leaves the box */
async function boxExtract(f){
  if(f.size > 25e6) throw new Error('too big');
  const fd = new FormData(); fd.append('file', f, f.name);
  const up = await fetch('/api/v1/files/?process=true&process_in_background=false', {method:'POST', credentials:'same-origin', headers:token() ? {Authorization:'Bearer ' + token()} : {}, body:fd});
  if(!up.ok) throw new Error('upload ' + up.status);
  const j = await up.json();
  let t = '';
  for(let k = 0; k < 20 && !t; k++){
    const r = await api('/api/v1/files/' + j.id + '/data/content');
    if(r.ok) t = ((await r.json()).content || '').trim();
    if(!t) await wait(1500);
  }
  if(!t) throw new Error('empty');
  return t.slice(0, 60000);
}

const token = () => localStorage.token || '';
const api = (path, opt = {}) => fetch(path, {...opt, credentials:'same-origin', headers:{'Content-Type':'application/json', ...(token() ? {Authorization:'Bearer ' + token()} : {}), ...(opt.headers || {})}});
function sysPrompt(c){
  const p = c.proj && proj(c.proj), parts = [`You are Li, a private assistant running on ${ME.first ? ME.first + "'s" : 'the user\'s'} own GPU box.${webOn() ? ' Web search is on for this chat: when web pages are attached below, ground your answer in them and cite them.' : ' Web search is off for this chat, so nothing leaves this machine.'} Write like a sharp friend texting back: lead with the answer in the first sentence, keep it short (two to five sentences or a tight list) unless asked for depth, no headings, no sections explaining why you answered the way you did, no filler. Use a code block only for code. Never use em dashes.`];
  if(S.mem && MEM.length) parts.push('Starter notes about the user (read-only):\n' + MEM.map(m => '- ' + m[0]).join('\n'));
  if(p){ if(p.instr) parts.push(`Channel "${p.name}" instructions:\n${p.instr}`); if((p.src || []).length) parts.push(`Reference sources for this channel. Point the user to them by name and link when they help. You can't open them from here, so never claim you checked one:\n` + p.src.map(s => `- ${s.n} (${s.u})${s.d ? ': ' + s.d : ''}`).join('\n')); (p.files || []).filter(f => f.text).forEach(f => parts.push(`Project file ${f.n}:\n${f.text.slice(0, 20000)}`)); }
  if(talkOn) parts.push('This reply will be spoken out loud on a voice call. Talk like a person on the phone: one to three short, natural sentences, no lists, no markdown, no code unless asked. Sound warm and direct.');
  if(c.caseMode) parts.push('This chat is a case file. Keep every date, amount and name exactly as written. Never guess or fill gaps.');

}
function userContent(x){
  let text = x.t || '';
  (x.files || []).forEach(f => { if(f.text) text += `\n\nFile ${f.n}:\n\`\`\`\n${f.text}\n\`\`\``; else if(f.k !== 'img' || !f.data) text += `\n\n[Attached ${f.n}, which couldn't be read]`; });
  const imgs = (x.files || []).filter(f => f.k === 'img' && f.data);
  return imgs.length ? [{type:'text', text}, ...imgs.map(f => ({type:'image_url', image_url:{url:f.data}}))] : text;
}

/* ---------- web: private search on the box (SearXNG) plus a page reader, per-chat toggle ---------- */
const webOn = () => { const c = chat(); return c ? c.web !== false : S.nextWeb !== false; };
const paintWeb = () => { const b = $('webc'); if(!b) return; const on = webOn(); b.classList.toggle('on', on); b.innerHTML = ic('globe') + (on ? 'Web' : 'Web <i>off</i>'); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Web search on for this chat. Tap to turn off' : 'Web search off for this chat. Tap to turn on'); };

const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return ''; } };
async function gatherWeb(c, idx, label){
  const us = c.msgs.slice(0, idx).filter(x => x.r === 'u'), last = us[us.length - 1]; if(!last) return null;
  const said = last.t || '';
  const urls = [...new Set((said.match(/https?:\/\/[^\s)>\]"']+/g) || []).map(u => u.replace(/[.,;:!?]+$/, '')))];
  let qtext = said.replace(/https?:\/\/\S+/g, ' ').replace(/\s+/g, ' ').trim();
  if(qtext.split(' ').length < 5 && us.length > 1) qtext = (us[us.length - 2].t || '').slice(0, 160) + ' ' + qtext;
  const p = c.proj && proj(c.proj), srcs = (p && p.src) || [], low = said.toLowerCase();
  srcs.forEach(s => { const h = hostOf(s.u), w = (s.n || '').toLowerCase().split(/[\s(:]/)[0]; if((h && low.includes(h)) || (w.length >= 4 && new RegExp('\\b' + w.replace(/[^a-z0-9]/g, '') + '\\b').test(low))) urls.push(s.u); });
  const want = [...new Set(urls)].slice(0, 3);
  const searches = [];
  if(/[a-z0-9]/i.test(qtext)){
    label('Searching the web');
    searches.push(j('/li-auth/web/search', {method:'POST', body:JSON.stringify({q:qtext.slice(0, 280), n:6})}).catch(() => ({results:[]})));
    const doms = [...new Set(srcs.map(s => hostOf(s.u)).filter(Boolean))].slice(0, 4);
    if(doms.length) searches.push(j('/li-auth/web/search', {method:'POST', body:JSON.stringify({q:qtext.slice(0, 200) + ' ' + doms.map(d => 'site:' + d).join(' OR '), n:4})}).catch(() => ({results:[]})));
  }
  const res = await Promise.all(searches), seen = new Set(want);
  const scoped = (res[1] && res[1].results) || [], general = (res[0] && res[0].results) || [];
  const hits = [...scoped.slice(0, 2), ...general].filter(r => !seen.has(r.url) && seen.add(r.url));
  const pick = [...want.map(u => ({url:u, title:'', snippet:''})), ...hits].slice(0, 4);
  if(!pick.length) return null;
  label('Reading ' + pick.length + (pick.length > 1 ? ' pages' : ' page'));
  const pages = await Promise.all(pick.map(r => j('/li-auth/web/read', {method:'POST', body:JSON.stringify({url:r.url, chars:4500})}).then(x => ({...r, title:x.title || r.title, text:x.text, url:x.url || r.url})).catch(() => r.snippet ? {...r, text:r.snippet} : null)));
  const ok = pages.filter(x => x && x.text && x.text.trim().length > 40).map((x, k) => ({n:k + 1, t:x.title || hostOf(x.url), u:x.url, text:x.text}));
  return ok.length ? ok : null;
}
let busy = false, ctl = null, leftPage = false;

const wait = ms => new Promise(r => setTimeout(r, ms));
async function respond(c, idx, alt){

  const target = thread.querySelector(`.a[data-i="${idx}"]`);

/* ---------- talk mode: you talk, the box's own Whisper writes it down, the 27B answers, your phone reads it out ---------- */
let talkOn = false, muted = false, rec = null, stream = null;

/* Li's voice: Kokoro on the box, one sentence at a time while the reply streams in.
   Falls back to the phone's own voice if the box voice can't be reached. */
const sayLocal = text => new Promise(res => {
  if(!('speechSynthesis' in window) || !text){ res(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().filter(x => x.localService && /^en/i.test(x.lang));
  if(v.length) u.voice = v.find(x => /samantha|daniel|alex|aaron|natural/i.test(x.name)) || v[0];
  u.onend = u.onerror = () => res(); speechSynthesis.speak(u);
});
const voice = (() => {
  let gen = 0, buf = '', chain = Promise.resolve(), pending = 0, doneRes = null, ended = false, unlocked = false, playing = null;
  /* one <audio> element, unlocked by a tap, then reused: iPhones play it even with the silent switch on */
  const el = new Audio(); el.setAttribute('playsinline', ''); el.preload = 'auto';
  const silent = (() => { const n = 2400, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 24000, true); v.setUint32(28, 48000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], {type:'audio/wav'})); })();
  const spoken = t => t.replace(/```[\s\S]*?(```|$)/g, ' I put the code in the chat. ').replace(/`([^`]*)`/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/https?:\/\/\S+/g, 'a link').replace(/\[\d+(?:,\s*\d+)*\]/g, '').replace(/[*_#>|~]+/g, ' ').replace(/\s+/g, ' ').trim();
  const unlock = () => {
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    if(unlocked || playing) return;
    try{ el.src = silent; const p = el.play(); unlocked = true; p && p.catch(() => { unlocked = false; }); }catch(e){}
  };
  const fetchWav = text => api('/li-auth/tts', {method:'POST', body:JSON.stringify({text, voice:S.voice.name || 'af_heart'})}).then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('tts ' + r.status)));
  const play = ab => new Promise(res => {
    const url = URL.createObjectURL(new Blob([ab], {type:'audio/wav'}));
    const done = ok => { if(playing !== url) return; playing = null; URL.revokeObjectURL(url); window.liTps = 0; $('spk') && $('spk').classList.remove('talking'); res(ok); };
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    playing = url; el.onended = () => done(true); el.onerror = () => done(false); el.src = url;
    const p = el.play(); window.liTps = 18; $('spk') && $('spk').classList.add('talking');
    if(p) p.catch(() => done(false));
  });
  const settle = () => { if(ended && !pending && doneRes){ const r = doneRes; doneRes = null; r(); } };
  const say = text => {
    const g = gen, t = spoken(text); if(!/[a-z0-9]/i.test(t)) return;
    pending++;
    const audio = fetchWav(t).catch(() => null); /* starts now, so the next sentence renders while this one plays */
    chain = chain.then(async () => {
      if(g !== gen) return;
      const ab = await audio; if(g !== gen) return;
      const ok = ab ? await play(ab) : false;
      if(!ok && g === gen){ window.liTps = 18; await sayLocal(t); window.liTps = 0; }
    }).finally(() => { pending--; settle(); });
  };
  return {
    unlock,
    feed(delta){
      buf += delta;
      for(;;){
        const code = buf.indexOf('```');
        if(code >= 0){ const close = buf.indexOf('```', code + 3); if(close < 0){ if(code > 0){ say(buf.slice(0, code)); buf = buf.slice(code); } return; } say(buf.slice(0, code) + ' I put the code in the chat. '); buf = buf.slice(close + 3); continue; }
        const m = buf.match(/^([\s\S]{8,}?[.!?:;](?=\s)|[\s\S]*?\n\n)/);
        if(!m){ if(buf.length > 260){ const cut = buf.lastIndexOf(' ', 220); say(buf.slice(0, cut > 40 ? cut : 220)); buf = buf.slice(cut > 40 ? cut : 220); } return; }

    },
    end(){ if(buf.trim()) say(buf); buf = ''; },
    finished(){ ended = true; return new Promise(r => { doneRes = r; settle(); }).finally(() => { ended = false; }); },
    stop(){ gen++; buf = ''; try{ el.pause(); }catch(e){} if(playing){ URL.revokeObjectURL(playing); playing = null; } $('spk') && $('spk').classList.remove('talking'); if('speechSynthesis' in window) speechSynthesis.cancel(); window.liTps = 0; },
    get busy(){ return pending > 0; }

})();
function listenOnce(){
  return new Promise(async (res, rej) => {
    try{ if(navigator.audioSession) navigator.audioSession.type = 'play-and-record'; }catch(e){}
    try{ stream = stream || await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ rej(new Error('mic')); return; }
    const ac = new (window.AudioContext || window.webkitAudioContext)(), src = ac.createMediaStreamSource(stream), an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize), chunks = []; let spoke = false, quietSince = 0; const t0 = performance.now();
    rec = new MediaRecorder(stream); rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { ac.close(); res(spoke ? new Blob(chunks, {type: rec.mimeType || 'audio/webm'}) : null); };
    rec.start(250);
    const loop = () => {
      if(!rec || rec.state !== 'recording') return;
      an.getByteTimeDomainData(buf); let sum = 0; for(const v of buf){ const d = (v - 128) / 128; sum += d * d; }
      const rms = Math.sqrt(sum / buf.length), now = performance.now();
      if(rms > 0.035){ spoke = true; quietSince = 0; } else if(spoke && !quietSince) quietSince = now;
      if((spoke && quietSince && now - quietSince > 1300) || now - t0 > 30000 || !talkOn || muted) rec.stop(); else requestAnimationFrame(loop);
    };
    loop();
  });
}
async function talkLoop(){
  while(talkOn){
    if(muted){ $('tstate').textContent = 'Muted'; $('wave').style.visibility = 'hidden'; await wait(400); continue; }
    $('tstate').textContent = 'Listening'; $('wave').style.visibility = 'visible'; window.liTps = 0;
    let blob; try{ blob = await listenOnce(); }catch(e){ $('tstate').textContent = 'Mic blocked'; $('tcap').textContent = 'Allow the microphone for this site, then try again.'; talkOn = false; break; }
    if(!talkOn) break; if(!blob) continue;
    $('tstate').textContent = 'Writing it down'; $('wave').style.visibility = 'hidden';
    let text = '';
    try{
      const fd = new FormData(); fd.append('file', blob, 'talk.' + (/mp4/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm'));
      const r = await fetch('/api/v1/audio/transcriptions', {method:'POST', credentials:'same-origin', headers:token() ? {Authorization:'Bearer ' + token()} : {}, body:fd});
      if(r.ok) text = ((await r.json()).text || '').trim();
    }catch(e){}
    if(!talkOn) break;
    if(!/[a-z0-9]/i.test(text)){ $('tcap').textContent = "Didn't catch that."; continue; }
    $('tcap').textContent = '“' + text + '”';
    let c = chat();
    if(!c){ c = {id:'c' + Date.now(), title:text.slice(0, 42), pinned:false, proj:S.curProj, model:'local', caseMode:S.curProj === 'p2', t:Date.now(), msgs:[]}; S.chats.push(c); S.cur = c.id; S.curProj = null; }
    c.msgs.push({r:'u', t:text, files:[], ts:Date.now()}); renderThread();
    $('tstate').textContent = 'Li is thinking';
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } /* phones route sound to the earpiece while the mic is open */
    const reply = await respond(c, c.msgs.length, false);
    if(!talkOn) break;
    $('tcap').textContent = reply.replace(/```[\s\S]*?```/g, '[code in the chat]').replace(/[*_#`]/g, '').slice(0, 220);

  }

}

        <span class="badge ${esc(u.role)}">${esc(u.role)}</span>
        ${me ? '' : `<div class="pa"><button class="btn mini" data-s="uman" data-id="${esc(u.id)}">Manage</button></div>`}</div>`; }).join('') + `<div class="btns" style="margin-top:12px"><button class="btn dark" data-s="atab" data-t="invites">Invite someone</button></div>`);
      window.__users = us;
    } else {
      const xs = await j('/li-auth/invites');
      sheet(seg + `<div class="btns" style="justify-content:flex-start;margin-bottom:8px"><button class="btn dark" data-s="invnew">New invite</button></div>` +

          <span class="badge ${esc(i.status)}">${esc(i.status)}</span>${i.status === 'waiting' ? `<div class="pa"><button class="btn mini" data-s="invdel" data-id="${esc(i.id)}">Cancel</button></div>` : ''}</div>`).join('') : '<div class="note">No invites yet. An invite is a one-time link. Only someone with it can make an account.</div>'));

  }catch(e){ sheet(seg + `<div class="warnbox">${esc(e.message)}</div>`); }
}
function inviteForm(){
  sheet(`<div class="sh">New invite</div><div class="note">Makes a one-time link. It works once, then it's used up.</div>
    <input class="field" id="ilab" placeholder="Who is it for? (just a label)" maxlength="80">
    <input class="field" id="iem" type="email" placeholder="Their email (optional, locks the invite to it)">
    <div class="note">Link works for</div><div class="vrow">${[1,7,30].map(d => `<button class="${d === 7 ? 'on' : ''}" data-s="idays" data-d="${d}">${d} day${d > 1 ? 's' : ''}</button>`).join('')}</div>
    <div class="note" id="ierr" style="color:var(--rust)"></div>
    <div class="btns"><button class="btn" data-s="atab" data-t="invites">Back</button><button class="btn dark" data-s="invmake">Make invite</button></div>`);
}
function inviteMade(x){
  sheet(`<div class="sh">Invite ready${x.label ? ' for ' + esc(x.label) : ''}</div>
    <div class="note">Send them this link. It works once${x.email ? ', only for ' + esc(x.email) : ''}, until ${new Date(x.expires_at * 1000).toLocaleDateString()}. You won't see the code again after you close this.</div>
    <div class="linkbox" id="ilink">${esc(x.link)}</div><div class="note" style="text-align:center">or the code</div><div class="bigcode">${esc(x.code)}</div>
    <div class="btns"><button class="btn" data-s="atab" data-t="invites">Done</button>${navigator.share ? '<button class="btn" data-s="invshare">Share</button>' : ''}<button class="btn dark" data-s="invcopy">Copy link</button></div>`);
  window.__inv = x;
}
function userSheet(id){
  const u = (window.__users || []).find(x => x.id === id); if(!u) return;
  sheet(`<div class="sh">${esc(u.name || u.email)}</div><div class="note">${esc(u.email)} · <span class="badge ${esc(u.role)}">${esc(u.role)}</span></div>
    ${u.role === 'pending' ? `<button class="opt" data-s="urole" data-id="${esc(id)}" data-r="user">${ic('check')}<span>Approve<small>Let them use Li</small></span></button>` : ''}
    ${u.role !== 'admin' ? `<button class="opt" data-s="urole" data-id="${esc(id)}" data-r="admin">${ic('people')}<span>Make admin<small>Can invite and manage people</small></span></button>` : `<button class="opt" data-s="urole" data-id="${esc(id)}" data-r="user">${ic('people')}<span>Make a regular user<small>Removes admin rights</small></span></button>`}
    ${u.role === 'user' ? `<button class="opt" data-s="urole" data-id="${esc(id)}" data-r="pending">${ic('lock')}<span>Pause access<small>They can't sign in until you approve them again</small></span></button>` : ''}
    <button class="opt danger" data-s="udel" data-id="${esc(id)}">${ic('x')}<span>Remove account<small>Deletes the account and its chats on the box</small></span></button>
    <div class="btns"><button class="btn" data-s="atab" data-t="people">Back</button></div>`);
}
async function setRole(id, role){
  const u = (window.__users || []).find(x => x.id === id); if(!u) return;
  try{ await j(`/api/v1/users/${id}/update`, {method:'POST', body:JSON.stringify({role, name:u.name, email:u.email, profile_image_url:u.profile_image_url || '/user.png'})}); toast(role === 'admin' ? 'Now an admin' : role === 'pending' ? 'Access paused' : 'Done'); adminSheet('people'); }
  catch(e){ toast(e.message); }
}
let invDays = 7;
$('sheetIn').addEventListener('click', async e => {
  const b = e.target.closest('[data-s]'); if(!b) return; const s = b.dataset.s;
  if(s === 'toinvite') authSheet('invite');
  else if(s === 'tosignin'){ history.replaceState(null, '', location.pathname); authSheet('signin'); }
  else if(s === 'faceon'){ b.disabled = true; await faceRegister(); closeS(); }
  else if(s === 'faceadd'){ b.disabled = true; await faceRegister(); faceSheet(); }
  else if(s === 'pkdel'){ try{ await j('/li-auth/passkeys/' + encodeURIComponent(b.dataset.id), {method:'DELETE'}); toast('Removed'); }catch(err){ toast(err.message); } faceSheet(); }
  else if(s === 'faceset') faceSheet();
  else if(s === 'voiceset') voiceSheet();
  else if(s === 'voicetoggle'){ S.voice.on = !S.voice.on; save(); spkPaint(); b.querySelector('.sw').classList.toggle('on', S.voice.on); if(S.voice.on){ voice.unlock(); voice.feed('Okay, I\'ll read my replies out loud.'); voice.end(); } else voice.stop(); }
  else if(s === 'voicepick'){ S.voice.name = b.dataset.v; save(); voice.stop(); voice.unlock(); voice.feed('Hi, this is how I sound.'); voice.end(); voiceSheet(); }
  else if(s === 'people') adminSheet('people');
  else if(s === 'atab') adminSheet(b.dataset.t);
  else if(s === 'invnew'){ invDays = 7; inviteForm(); }
  else if(s === 'idays'){ invDays = +b.dataset.d; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }
  else if(s === 'invmake'){ b.disabled = true; try{ inviteMade(await j('/li-auth/invites', {method:'POST', body:JSON.stringify({label:$('ilab').value.trim(), email:$('iem').value.trim(), days:invDays})})); }catch(err){ $('ierr').textContent = err.message; b.disabled = false; } }
  else if(s === 'invcopy') copy(window.__inv.link);
  else if(s === 'invshare'){ try{ await navigator.share({title:'Your invite to Li', text:'Here\'s your invite to Li:', url:window.__inv.link}); }catch(err){} }
  else if(s === 'invdel'){ try{ await j('/li-auth/invites/' + b.dataset.id, {method:'DELETE'}); toast('Invite cancelled'); }catch(err){ toast(err.message); } adminSheet('invites'); }
  else if(s === 'uman') userSheet(b.dataset.id);
  else if(s === 'urole') setRole(b.dataset.id, b.dataset.r);
  else if(s === 'udel'){ const u = (window.__users || []).find(x => x.id === b.dataset.id); sheet(`<div class="sh">Remove ${esc(u ? u.name || u.email : 'this account')}?</div><div class="warnbox">Their account and everything it saved on the box are deleted. This can't be undone. Chats saved in their own browser stay there.</div><div class="btns"><button class="btn" data-s="uman" data-id="${esc(b.dataset.id)}">Keep</button><button class="btn warn" data-s="udodel" data-id="${esc(b.dataset.id)}">Remove for good</button></div>`); }
  else if(s === 'udodel'){ try{ await j('/api/v1/users/' + b.dataset.id, {method:'DELETE'}); toast('Account removed'); }catch(err){ toast(err.message); } adminSheet('people'); }
});

async function signOut(){ voice.stop(); try{ await api('/api/v1/auths/signout', {method:'POST'}); }catch(e){} delete localStorage.token; closeS(); authSheet('signin'); }
async function boot(fresh){
  try{
    const r = await api('/api/v1/auths/');
    if(!r.ok){
      const cfg = await fetch('/api/config', {credentials:'same-origin'}).then(x => x.json()).catch(() => ({}));
      authSheet(cfg.onboarding ? 'first' : null); return;
    }
    const u = await r.json(); ME = {name:u.name || '', first:(u.name || '').split(' ')[0], id:u.id || '', role:u.role || ''};
    if(ME.role === 'pending'){ authSheet('pending'); return; }
    $('meName').textContent = ME.name || 'You'; $('meAv').textContent = (ME.name || 'Y')[0].toUpperCase(); greet();
    try{ const n = await fetch('/li/notes.json', {credentials:'same-origin', cache:'no-store'}).then(x => x.json()); MEM = (n.notes || []).map(o => [o.text, o.kind || '']); }catch(e){ MEM = []; }
    const m = await api('/api/models').then(x => x.json()).catch(() => ({}));
    const ids = (m.data || []).map(x => x.id);
    MODEL = ids.find(x => /qwen3\.8|abliterated/i.test(x)) || ids[0] || '';
    if(!MODEL) toast('No model found on the box');
    renderThread();
    if(fresh && S.offerFace){ S.offerFace = false; save(); faceOffer(); }
  }catch(e){ toast('Couldn\'t reach the box'); }
}
renderThread(); updateSend(); boot();
}
</script>
